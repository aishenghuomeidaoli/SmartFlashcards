# 固定项目名：避免与同机上另一个同名目录（例如旧克隆）共用卷与容器名，
# 也避免租户的卷被不同大版本的 Postgres 打开（PG16 的数据目录 PG17 打不开，直接崩在启动）。
name: smartflashcards-sfo

# 一键起整套（db + 后端 + 前端）：
#   cp .env.example .env     # 按注释改
#   docker compose up -d --build
# 只想在本机跑开发、把数据库交给 docker：
#   docker compose up -d db
#
# 变量全部从仓库根的 .env 读（模板见 .env.example）。
# ⚠️ 前端容器的 NEXT_PUBLIC_* 是**构建期**参数，改完 client id 要 `docker compose build web` 重建。

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartflashcards}
      POSTGRES_USER: ${POSTGRES_USER:-smartflashcards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 里设置}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 后端要等它真的能接连接，否则 migrate 会连不上
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartflashcards} -d ${POSTGRES_DB:-smartflashcards}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        # 网络受限（例如国内直连 PyPI 不通）时在 .env 里设 PIP_INDEX_URL
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器里连的是 compose 网络里的 db，不是宿主 127.0.0.1
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # BFF / SSR 是用服务名调后端的（http://backend:8000），Host 头就是 backend，
      # 不把它加进 ALLOWED_HOSTS 会直接 400（DisallowedHost）—— 登录后所有接口全挂
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend
    # 启动前先把迁移跑完，再交给 gunicorn
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 2 --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # 与后端共用同一个 client id（同一个 .env，避免两处写不一致）
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
        # 网络受限时在 .env 里设 NPM_REGISTRY（例如 https://registry.npmmirror.com）
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      # 容器内互访：服务端组件 / BFF 通过服务名打后端
      DJANGO_API_BASE: http://backend:8000
      # GitHub 只注册一个回调地址，这里必须与 GitHub 控制台里填的一致
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/auth/github/callback}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
